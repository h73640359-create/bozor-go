name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test va debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Katalog seedini tekshirish (1000+ mahsulot)
        run: python3 data/scripts/validate_catalog.py --with-images

      - name: local.properties tayyorlash
        # API_BASE_URL bo'sh bo'lsa ilova to'liq oflayn (lokal baza) rejimida yig'iladi.
        # Real server uchun repositoriyga API_BASE_URL sirini qo'shing.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Unit testlar
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Debug APK yig'ish
        id: assemble
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee assemble-debug.log

      # Muvaffaqiyatsiz yig'ish jurnalini shu branchga yozib qo'yamiz
      # (GitHub Actions loglarini tashqaridan o'qib bo'lmaganda tashxis uchun).
      - name: Yig'ish jurnalini saqlash
        if: failure()
        run: |
          mkdir -p ci-logs
          [ -f unit-tests.log ] && cp unit-tests.log ci-logs/unit-tests.log || true
          [ -f assemble-debug.log ] && cp assemble-debug.log ci-logs/assemble-debug.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          if git diff --cached --quiet; then
            echo "Jurnal o'zgarmagan"
          else
            git commit -m "CI: yig'ish jurnali (run $GITHUB_RUN_NUMBER)"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi

      - name: Jurnallar va test hisobotlari (muvaffaqiyatsiz bo'lsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            unit-tests.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Imzolangan release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Faqat v* teg qo'yilganda va imzolash sirlari mavjud bo'lganda ishlaydi.
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_BUILD == 'true'

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Imzolash kalitini tiklash
        # Kerakli sirlarni qo'shish tartibi docs/CI.md faylida.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/bozorgo.jks"

      - name: local.properties tayyorlash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bozorgo.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Release APK yig'ish
        run: ./gradlew assembleRelease --stacktrace

      - name: Release artefaktlari
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
