name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test va debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Katalog seedini tekshirish (1000+ mahsulot)
        run: python3 data/scripts/validate_catalog.py --with-images

      - name: local.properties tayyorlash
        # API_BASE_URL bo'sh bo'lsa ilova to'liq oflayn (lokal baza) rejimida yig'iladi.
        # Real server uchun repositoriyga API_BASE_URL sirini qo'shing.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Unit testlar
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Debug APK yig'ish
        id: assemble
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee assemble-debug.log

      # APK ichida rasmlar haqiqatan borligini tekshirish (rasm fayl kiritilmay
      # qolgan bo'lsa — yig'ish muvaffaqiyatsiz tugaydi, jim o'tib ketmaydi).
      - name: APK ichidagi rasmlarni tekshirish
        run: |
          python3 - <<'PY'
          import sys, zipfile

          APK = "app/build/outputs/apk/debug/app-debug.apk"
          try:
              z = zipfile.ZipFile(APK)
          except FileNotFoundError:
              print("::error::APK topilmadi: " + APK)
              sys.exit(1)

          names = z.namelist()
          groups = {
              "Mahsulot rasmlari": "assets/products/",
              "Kategoriya rasmlari": "assets/categories/",
              "Zaxira rasmlar": "assets/fallback/",
              "Banner rasmlari": "assets/banners/",
          }
          minimum = {
              "Mahsulot rasmlari": 1000,
              "Kategoriya rasmlari": 15,
              "Zaxira rasmlar": 15,
              "Banner rasmlari": 5,
          }

          total_bytes = 0
          problems = []
          for label, prefix in groups.items():
              files = [
                  n for n in names
                  if n.startswith(prefix) and n.lower().endswith(".webp")
              ]
              size = sum(z.getinfo(n).file_size for n in files)
              total_bytes += size
              print(f"{label}: {len(files)} ta ({size / 1024 / 1024:.2f} MB)")
              if len(files) < minimum[label]:
                  problems.append(
                      f"{label}: kutilgan >= {minimum[label]}, topildi {len(files)}"
                  )
              empty = [n for n in files if z.getinfo(n).file_size < 500]
              if empty:
                  problems.append(f"{label}: bo'sh/juda kichik fayllar: {empty[:3]}")

          for seed in ("assets/seed/catalog.json", "assets/seed/categories.json"):
              if seed not in names:
                  problems.append(f"APK ichida seed fayli yo'q: {seed}")

          print(f"APK hajmi: {sum(z.getinfo(i).file_size for i in z.infolist()) / 1024 / 1024:.1f} MB")
          print(f"Rasmlar jami: {total_bytes / 1024 / 1024:.2f} MB")

          for problem in problems:
              print("::error::" + problem)
          sys.exit(1 if problems else 0)
          PY

      - name: APK artefakti
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Muvaffaqiyatsiz yig'ish xatolarini annotatsiya sifatida chiqarish
      # (Actions jurnali tashqaridan o'qilmagani uchun; annotatsiya limiti 10 ta).
      - name: Xatoliklarni annotatsiya qilish
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          noise = ("public inline fun", "public fun ", "public final fun", "defined in kotlin")
          pattern = re.compile(r'(e: |> Task .*FAILED|.*AAPT.*|.*: error:.*|.*Unresolved reference.*|.*Execution failed.*|.*Caused by.*|FAILED$|AssertionError|ComparisonFailure|expected:|but was:|java\\.lang\\.|org\\.junit\\.|Tests? failed)', re.I)
          for name in ("unit-tests.log", "assemble-debug.log"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              lines = [l.rstrip() for l in path.read_text(errors="ignore").splitlines()]
              picked = []
              for raw in lines:
                  line = raw.strip()
                  if line.startswith("e: "):
                      picked.append(line)
                  elif "defined in kotlin" in line or line.startswith("public ") or line.startswith("w: "):
                      continue
                  elif pattern.search(line):
                      picked.append(line)
              if not picked:
                  picked = [l.strip() for l in lines if "FAILED" in l or "error" in l.lower()]
              print(f"## {name}: jami {len(picked)} ta xatolik qatori")
              chunk = 8
              for index in range(0, min(len(picked), 64), chunk):
                  text = " // ".join(picked[index:index + chunk])
                  text = text.replace("%", "%25").replace("\r", "%0D")
                  print("::error::" + text[:1200])
          PY

      - name: Jurnallar va test hisobotlari (muvaffaqiyatsiz bo'lsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            unit-tests.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Imzolangan release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Faqat v* teg qo'yilganda va imzolash sirlari mavjud bo'lganda ishlaydi.
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_BUILD == 'true'

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Imzolash kalitini tiklash
        # Kerakli sirlarni qo'shish tartibi docs/CI.md faylida.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/bozorgo.jks"

      - name: local.properties tayyorlash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bozorgo.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Release APK yig'ish
        run: ./gradlew assembleRelease --stacktrace

      - name: Release artefaktlari
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
