name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test va debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Katalog seedini tekshirish (1000+ mahsulot)
        run: python3 data/scripts/validate_catalog.py --with-images

      - name: local.properties tayyorlash
        # API_BASE_URL bo'sh bo'lsa ilova to'liq oflayn (lokal baza) rejimida yig'iladi.
        # Real server uchun repositoriyga API_BASE_URL sirini qo'shing.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK yig'ish
        run: ./gradlew assembleDebug --stacktrace

      - name: APK artefakti
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Test hisobotlari (muvaffaqiyatsiz bo'lsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Imzolangan release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Faqat v* teg qo'yilganda va imzolash sirlari mavjud bo'lganda ishlaydi.
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE_BUILD == 'true'

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Imzolash kalitini tiklash
        # Kerakli sirlarni qo'shish tartibi docs/CI.md faylida.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/bozorgo.jks"

      - name: local.properties tayyorlash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties
          echo "KEYSTORE_FILE=$RUNNER_TEMP/bozorgo.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Gradle wrapper huquqlari
        run: chmod +x ./gradlew

      - name: Release APK yig'ish
        run: ./gradlew assembleRelease --stacktrace

      - name: Release artefaktlari
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
