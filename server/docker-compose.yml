# Lokal ishlab chiqish uchun PostgreSQL.
# Ishga tushirish:  docker compose up -d
version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: bozorgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bozorgo
      POSTGRES_PASSWORD: bozorgo
      POSTGRES_DB: bozorgo
    ports:
      - "5432:5432"
    volumes:
      - bozorgo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozorgo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bozorgo-pgdata:
